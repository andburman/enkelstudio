<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Bank connection – Enkel Studio</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #000; color: #8a8a8a;
    font: 300 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 2rem 1rem; box-sizing: border-box;
  }
  h1 { font-size: 1.5rem; font-weight: 400; letter-spacing: .04em; color: #e5e5e7; margin: 0 0 .8rem; }
  p { margin: 0 0 1.2rem; max-width: 28rem; }
  code {
    display: block; max-width: 100%; overflow-wrap: anywhere; box-sizing: border-box;
    font: .9rem ui-monospace, SFMono-Regular, Menlo, monospace; color: #e5e5e7;
    background: #111; border: 1px solid #222; border-radius: 8px; padding: .8rem 1rem; margin-bottom: 1rem;
  }
  button {
    font: inherit; color: #000; background: #de6f38; border: 0; border-radius: 8px;
    padding: .5rem 1.4rem; cursor: pointer;
  }
  .error { color: #de6f38; }
</style>
</head>
<body>
  <h1 id="title">Bank connection</h1>
  <p id="message">Missing authorization code.</p>
  <code id="code" hidden></code>
  <button id="copy" hidden>Copy</button>
<script>
  // Runs entirely in the browser: nothing is sent anywhere.
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const error = params.get("error");
  const title = document.getElementById("title");
  const message = document.getElementById("message");
  const codeEl = document.getElementById("code");
  const copy = document.getElementById("copy");

  if (error) {
    title.textContent = "Connection failed";
    message.className = "error";
    message.textContent = error + (params.get("error_description") ? ": " + params.get("error_description") : "");
  } else if (code) {
    title.textContent = "Bank connected";
    message.textContent = "Copy this code and paste it into the terminal. It expires shortly.";
    codeEl.textContent = code;
    codeEl.hidden = false;
    copy.hidden = false;
    copy.onclick = async () => {
      await navigator.clipboard.writeText(code);
      copy.textContent = "Copied";
    };
  }
  // Keep the code out of browser history.
  history.replaceState(null, "", location.pathname);
</script>
</body>
</html>
