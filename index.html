<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enkel Studio</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #000; color: #8a8a8a;
    font: 300 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 2rem;
  }
  .dot {
    width: 34px; height: 34px; border-radius: 50%;
    background: #de6f38; box-shadow: 0 0 34px 6px rgba(222,111,56,.35);
    margin-bottom: 2.6rem; animation: breathe 4.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 22px 3px rgba(222,111,56,.22); }
    50%      { box-shadow: 0 0 40px 8px rgba(222,111,56,.45); }
  }
  h1 {
    font-size: 1.5rem; font-weight: 400; letter-spacing: .04em;
    color: #e5e5e7; margin: 0 0 .8rem;
  }
  p { margin: 0; max-width: 22rem; }
  a { color: #de6f38; text-decoration: none; }
  .contact { margin-top: 2.4rem; font-size: .8rem; letter-spacing: .08em;
             font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #4a4a4a; }
</style>
</head>
<body>
  <div class="dot"></div>
  <h1>Enkel Studio</h1>
  <p>Small, simple software. Made in Sweden.<br>First out: <a href="https://soundterrain.enkelstudio.eu/support.html">Sound Terrain</a> — noise made as you listen.</p>
  <p class="contact"><a href="mailto:hello@enkelstudio.eu">hello@enkelstudio.eu</a></p>
</body>
</html>
